<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1f7fe0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Καιρός">
<meta name="application-name" content="Καιρός">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Premium weather app — Open-Meteo data">
<title>Καιρός</title>
<link rel="manifest" id="manifestLink">
<link rel="apple-touch-icon" id="touchIcon">
<link rel="icon" id="favIcon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --ink:#ffffff;
  --ink-soft:rgba(255,255,255,.72);
  --glass:rgba(255,255,255,.16);
  --glass-b:rgba(255,255,255,.28);
  --shadow:0 8px 32px rgba(0,0,0,.18);
  --glow:rgba(255,255,255,.18);
  --rain:#7cc4ff;
  --nav-h:68px;
}
body.light{
  --ink:#16202c;
  --ink-soft:rgba(22,32,44,.66);
  --glass:rgba(255,255,255,.42);
  --glass-b:rgba(255,255,255,.75);
  --shadow:0 8px 28px rgba(40,60,90,.15);
  --rain:#1f6fd1;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  color:var(--ink);background:#1e3c72;overflow:hidden;
  transition:color .8s ease;-webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;overscroll-behavior:none;
}
input{user-select:text;-webkit-user-select:text}
button{font-family:inherit;cursor:pointer}

/* ---------- Dynamic background ---------- */
.bg{position:fixed;inset:0;z-index:-4;opacity:0;transition:opacity 1.4s ease}
.bg.on{opacity:1}
.glow{position:fixed;inset:-25%;z-index:-3;pointer-events:none;
  background:radial-gradient(circle at 28% 18%,var(--glow),transparent 42%),
             radial-gradient(circle at 80% 85%,rgba(255,255,255,.08),transparent 40%);
  animation:drift 20s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(7%,5%) scale(1.05)}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none}
.flash{position:fixed;inset:0;z-index:-1;pointer-events:none;background:rgba(220,225,255,.5);opacity:0}

/* ---------- Layout ---------- */
#app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header.top{display:flex;align-items:center;gap:10px;padding:14px 18px 8px}
.loc{flex:1;min-width:0}
.loc h1{font-size:1.3rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.loc h1 i{font-size:.95rem;opacity:.85;flex:none}
.loc h1 span{overflow:hidden;text-overflow:ellipsis}
.loc p{font-size:.8rem;color:var(--ink-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.glass{background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--shadow)}
.icon-btn{width:46px;height:46px;flex:none;border-radius:15px;display:grid;place-items:center;color:var(--ink);font-size:1.05rem;transition:transform .15s}
.icon-btn:active{transform:scale(.9)}
.spin i{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

main{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 28px);-webkit-overflow-scrolling:touch}
.view{display:none}
.view.active{display:block;animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.card{border-radius:24px;padding:16px;margin-bottom:14px}
.card-title{display:flex;align-items:center;gap:8px;font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:12px}
.hidden{display:none !important}

/* ---------- Hero ---------- */
.hero{text-align:center;padding:10px 0 22px}
.hero .big-icon{font-size:4.6rem;filter:drop-shadow(0 8px 24px rgba(0,0,0,.18));animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.hero .temp{font-size:6rem;font-weight:200;line-height:1;margin-top:8px;letter-spacing:-.04em}
.hero .temp sup{font-size:2rem;font-weight:300;vertical-align:top;position:relative;top:.9rem;margin-left:2px}
.hero .desc{font-size:1.15rem;font-weight:500;margin-top:6px}
.hero .hl{font-size:.9rem;color:var(--ink-soft);margin-top:8px}
.hero .hl b{color:var(--ink);font-weight:600}

/* ---------- 24h strip ---------- */
.strip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;margin:0 -4px;padding:0 4px 2px;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.strip .h{flex:none;width:58px;text-align:center;padding:10px 0;border-radius:16px;scroll-snap-align:start}
.strip .h.now{background:var(--glass-b)}
.strip .ht{font-size:.74rem;color:var(--ink-soft);font-weight:600}
.strip .h.now .ht{color:var(--ink)}
.strip .h i{font-size:1.25rem;display:block;margin:9px 0}
.strip .hv{font-weight:600;font-size:.98rem}
.strip .hp{font-size:.66rem;color:var(--rain);font-weight:700;min-height:.95rem;margin-top:3px}

/* ---------- Rain next 2h ---------- */
.rain-msg{font-size:1rem;font-weight:600;display:flex;align-items:center;gap:10px;line-height:1.3}
.rain-msg i{font-size:1.2rem;color:var(--rain);flex:none}
.rbars{display:flex;align-items:flex-end;gap:5px;height:58px;margin-top:14px}
.rbars div{flex:1;border-radius:6px 6px 2px 2px;min-height:4px;transition:height .8s ease;background:linear-gradient(180deg,#9fd4ff,#3a8dff)}
.rbars div.dry{background:var(--glass-b)}
.rlabels{display:flex;justify-content:space-between;font-size:.68rem;color:var(--ink-soft);margin-top:6px}
.note{font-size:.7rem;color:var(--ink-soft);margin-top:8px}

/* ---------- Tiles ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tile{border-radius:22px;padding:14px;min-height:128px;display:flex;flex-direction:column}
.tile .t-head{display:flex;align-items:center;gap:7px;font-size:.72rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft)}
.tile .t-val{font-size:1.75rem;font-weight:600;margin-top:10px;line-height:1.1}
.tile .t-val small{font-size:.9rem;font-weight:500;color:var(--ink-soft);margin-left:3px}
.tile .t-sub{font-size:.8rem;color:var(--ink-soft);margin-top:auto;padding-top:8px}
.bar{height:7px;border-radius:9px;background:rgba(255,255,255,.22);overflow:hidden;margin-top:10px}
body.light .bar{background:rgba(22,32,44,.12)}
.bar>span{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#7cc4ff,#3a8dff);transition:width 1s ease}
.uv-scale{position:relative;height:7px;border-radius:9px;margin-top:10px;background:linear-gradient(90deg,#3ddc84 0%,#ffd23f 27%,#ff9233 50%,#ff4d4d 72%,#b46bff 100%)}
.uv-scale i{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.35);transform:translate(-50%,-50%);transition:left 1s ease}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:20px;color:#111;margin-top:6px;width:max-content;max-width:100%}
.compass{width:46px;height:46px;border-radius:50%;border:2px solid var(--glass-b);display:grid;place-items:center;position:relative;flex:none}
.compass b{position:absolute;top:-1px;font-size:.55rem;font-weight:700;color:var(--ink-soft)}
.compass i{font-size:1rem;transition:transform 1s ease}
.wind-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.tile.link{cursor:pointer}
.tile.link:active{transform:scale(.97)}

/* ---------- Sea ---------- */
.sea-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.sea-grid .sv{font-size:1.35rem;font-weight:600;margin-top:6px}
.sea-grid .sv small{font-size:.75rem;color:var(--ink-soft);font-weight:500;margin-left:2px}
.sea-grid .sl{font-size:.7rem;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.sea-grid i.wd{display:inline-block;font-size:.8rem;margin-left:4px;transition:transform 1s}
.sea-state{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:.82rem;color:var(--ink-soft)}

/* ---------- Sun card ---------- */
.sun-wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.sun-col{text-align:center;min-width:72px}
.sun-col i{font-size:1.25rem;margin-bottom:6px}
.sun-col .sv{font-size:1.2rem;font-weight:600}
.sun-col .sl{font-size:.72rem;color:var(--ink-soft)}
.sun-arc{flex:1;max-width:200px}
.sun-meta{text-align:center;font-size:.8rem;color:var(--ink-soft);margin-top:8px}

/* ---------- Forecast ---------- */
.seg{display:flex;padding:4px;border-radius:14px;gap:4px;background:rgba(0,0,0,.12)}
body.light .seg{background:rgba(22,32,44,.08)}
.seg button{flex:1;border:0;background:transparent;color:var(--ink-soft);font-weight:600;font-size:.85rem;padding:10px 6px;border-radius:11px;transition:all .25s}
.seg button.on{background:var(--glass-b);color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.12)}
.chart-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;margin:12px -6px 0;padding:0 6px}
.chart-scroll::-webkit-scrollbar{display:none}
.chart-inner{height:270px;position:relative}
.hint{font-size:.72rem;color:var(--ink-soft);text-align:center;margin-top:6px}
.day{display:grid;grid-template-columns:62px 34px 46px 1fr;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--glass-b)}
.day:last-child{border-bottom:0}
.day .dn{font-weight:600}
.day .dn small{display:block;font-size:.7rem;font-weight:500;color:var(--ink-soft)}
.day .di{font-size:1.3rem;text-align:center}
.day .dp{font-size:.78rem;color:var(--rain);font-weight:600}
.range{display:flex;align-items:center;gap:8px;font-size:.88rem;font-weight:600}
.range .lo{color:var(--ink-soft);width:30px;text-align:right}
.range .hi{width:30px}
.range .track{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.18);position:relative}
body.light .range .track{background:rgba(22,32,44,.1)}
.range .track span{position:absolute;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#6ec6ff,#ffd23f,#ff9233)}

/* ---------- Radar ---------- */
#radarMap{height:56vh;min-height:300px;border-radius:18px;overflow:hidden;isolation:isolate;background:#1b2233}
body.light #radarMap{background:#dfe6ee}
.leaflet-container{font-family:inherit}
.leaflet-control-attribution{font-size:9px !important}
.leaflet-bar{border:0 !important;border-radius:12px !important;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.25) !important}
.leaflet-bar a{width:36px !important;height:36px !important;line-height:36px !important;background:rgba(20,26,40,.75) !important;color:#fff !important;border-bottom:1px solid rgba(255,255,255,.15) !important;backdrop-filter:blur(8px)}
body.light .leaflet-bar a{background:rgba(255,255,255,.85) !important;color:#16202c !important;border-bottom-color:rgba(0,0,0,.08) !important}
.radar-ctl{display:flex;align-items:center;gap:12px;margin-top:12px}
.play{width:48px;height:48px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--ink);font-size:1rem;border:1px solid var(--glass-b);background:var(--glass-b)}
.radar-ctl input{flex:1;accent-color:#3a8dff;height:30px}
.radar-time{min-width:58px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.radar-time small{display:block;font-size:.66rem;font-weight:500;color:var(--ink-soft)}
.radar-msg{text-align:center;color:var(--ink-soft);font-size:.85rem;padding:10px 0 0}
.me-dot{width:16px;height:16px;border-radius:50%;background:#3a8dff;border:3px solid #fff;box-shadow:0 0 0 6px rgba(58,141,255,.3)}

/* ---------- Air quality ---------- */
.aqi-main{display:flex;align-items:center;gap:18px}
.ring{width:128px;height:128px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .rv b{font-size:2.2rem;font-weight:700;display:block;line-height:1}
.ring .rv small{font-size:.7rem;color:var(--ink-soft)}
.aqi-text h3{font-size:1.25rem;font-weight:700}
.aqi-text p{font-size:.85rem;color:var(--ink-soft);margin-top:6px;line-height:1.45}
.poll{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.poll .tile{min-height:auto}
.poll .t-val{font-size:1.35rem}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-left:auto}
.aqi-legend{display:flex;gap:4px;margin-top:14px}
.aqi-legend span{flex:1;height:6px;border-radius:4px}
.aqi-legend-l{display:flex;justify-content:space-between;font-size:.66rem;color:var(--ink-soft);margin-top:5px}

/* ---------- Search & settings ---------- */
.search-box{display:flex;align-items:center;gap:10px;border-radius:18px;padding:4px 6px 4px 16px;margin-bottom:12px}
.search-box i{color:var(--ink-soft)}
.search-box input{flex:1;background:transparent;border:0;outline:0;color:var(--ink);font-size:1rem;font-family:inherit;padding:12px 0;min-width:0}
.search-box input::placeholder{color:var(--ink-soft)}
.search-box button{border:0;background:transparent;color:var(--ink-soft);width:40px;height:40px;font-size:1rem;display:none}
.locate-wide{width:100%;border-radius:18px;padding:15px;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--ink);font-size:.95rem;font-weight:600;margin-bottom:14px;transition:transform .15s}
.locate-wide:active{transform:scale(.98)}
.results{border-radius:22px;overflow:hidden;margin-bottom:18px}
.res{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--glass-b);cursor:pointer;transition:background .2s}
.res:last-child{border-bottom:0}
.res:active{background:rgba(255,255,255,.15)}
.res .flag{font-size:1.6rem;width:32px;text-align:center}
.res .rn{font-weight:600}
.res .rs{font-size:.78rem;color:var(--ink-soft);margin-top:2px}
.res .chev{margin-left:auto;color:var(--ink-soft);font-size:.8rem}
.empty{padding:26px 16px;text-align:center;color:var(--ink-soft);font-size:.9rem}
.empty i{font-size:1.8rem;display:block;margin-bottom:10px;opacity:.7}
.section-label{font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin:6px 4px 10px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.set-row + .set-row{border-top:1px solid var(--glass-b);margin-top:8px;padding-top:14px}
.set-row .sl{display:flex;align-items:center;gap:10px;font-weight:600;font-size:.92rem}
.set-row .seg{width:190px;flex:none}
.set-row .seg button{padding:8px 4px;font-size:.8rem}

/* ---------- Bottom navigation ---------- */
nav.bottom{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));height:var(--nav-h);display:flex;align-items:center;border-radius:26px;z-index:20}
nav.bottom button{flex:1;min-width:0;height:100%;border:0;background:none;color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:.64rem;font-weight:600;position:relative;transition:color .25s}
nav.bottom button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.bottom button i{font-size:1.15rem;transition:transform .25s}
nav.bottom button.active{color:var(--ink)}
nav.bottom button.active i{transform:translateY(-2px) scale(1.08)}
nav.bottom button.active::after{content:'';position:absolute;bottom:6px;width:5px;height:5px;border-radius:50%;background:var(--ink)}

/* ---------- Loader & toast ---------- */
.loader{position:fixed;inset:0;display:grid;place-items:center;z-index:30;pointer-events:none;opacity:0;transition:opacity .3s}
.loader.on{opacity:1}
.loader div{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:1.4rem}
.loader i{animation:spin 1s linear infinite}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px);transform:translate(-50%,20px);opacity:0;padding:12px 18px;border-radius:16px;font-size:.85rem;font-weight:500;z-index:40;transition:all .35s;max-width:88%;text-align:center;background:rgba(15,20,35,.88);color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.updated{text-align:center;font-size:.7rem;color:var(--ink-soft);margin:4px 0 6px}
.updated a{color:inherit}
@media (prefers-reduced-motion: reduce){
  .glow,.hero .big-icon{animation:none}
}
</style>
</head>
<body>
<div class="bg on" id="bgA"></div>
<div class="bg" id="bgB"></div>
<div class="glow"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="flash" id="flash"></div>

<div id="app">
  <header class="top">
    <div class="loc">
      <h1><i class="fa-solid fa-location-dot" id="locIcon"></i><span id="locName">…</span></h1>
      <p id="locSub">&nbsp;</p>
    </div>
    <button class="icon-btn glass" id="btnRefresh" data-i18n-aria="refresh"><i class="fa-solid fa-rotate-right"></i></button>
    <button class="icon-btn glass" id="btnLocate" data-i18n-aria="locate"><i class="fa-solid fa-location-crosshairs"></i></button>
  </header>

  <main id="main">
    <!-- ================= NOW ================= -->
    <section class="view active" id="view-now">
      <div class="hero">
        <i class="fa-solid fa-sun big-icon" id="heroIcon"></i>
        <div class="temp"><span id="temp">--</span><sup>°C</sup></div>
        <div class="desc" id="desc">—</div>
        <div class="hl"><span data-i18n="feels"></span> <b id="feels">--°</b> &nbsp;·&nbsp; <i class="fa-solid fa-arrow-up"></i> <b id="tmax">--°</b> &nbsp; <i class="fa-solid fa-arrow-down"></i> <b id="tmin">--°</b></div>
      </div>

      <div class="card glass">
        <div class="card-title"><i class="fa-regular fa-clock"></i><span data-i18n="hours24"></span></div>
        <div class="strip" id="strip"></div>
      </div>

      <div class="card glass hidden" id="rainCard">
        <div class="card-title"><i class="fa-solid fa-cloud-rain"></i><span id="rainTitle" data-i18n="rainTitle"></span></div>
        <div class="rain-msg" id="rainMsg"></div>
        <div class="rbars" id="rainBars"></div>
        <div class="rlabels"><span data-i18n="nowLabel"></span><span data-i18n="plus1h"></span><span data-i18n="plus2h"></span></div>
        <div class="note" data-i18n="rainNote"></div>
      </div>

      <div class="grid">
        <div class="tile glass">
          <div class="t-head"><i class="fa-solid fa-droplet"></i><span data-i18n="humidity"></span></div>
          <div class="t-val" id="hum">--<small>%</small></div>
          <div class="bar"><span id="humBar" style="width:0"></span></div>
          <div class="t-sub" id="humSub">—</div>
        </div>

        <div class="tile glass">
          <div class="t-head"><i class="fa-solid fa-wind"></i><span data-i18n="wind"></span></div>
          <div class="wind-row">
            <div class="t-val" style="margin-top:0" id="wind">--<small>km/h</small></div>
            <div class="compass"><b id="compN">Β</b><i class="fa-solid fa-location-arrow" id="windArrow"></i></div>
          </div>
          <div class="t-sub" id="windSub">—</div>
        </div>

        <div class="tile glass">
          <div class="t-head"><i class="fa-solid fa-sun"></i><span data-i18n="uv"></span></div>
          <div class="t-val" id="uv">--</div>
          <div class="uv-scale"><i id="uvDot" style="left:0"></i></div>
          <div class="t-sub"><span class="badge" id="uvBadge">—</span></div>
        </div>

        <div class="tile glass">
          <div class="t-head"><i class="fa-solid fa-mountain-sun"></i><span data-i18n="elevation"></span></div>
          <div class="t-val" id="elev">--</div>
          <div class="t-sub" id="coords">—</div>
        </div>

        <div class="tile glass">
          <div class="t-head"><i class="fa-solid fa-gauge-high"></i><span data-i18n="pressure"></span></div>
          <div class="t-val" id="press">--<small>hPa</small></div>
          <div class="t-sub" id="pressSub">—</div>
        </div>

        <div class="tile glass link" id="aqiTile">

};
const wmo = c => WMO[c] || ['—','—','cloud','cloud','cloudy'];
const wDesc = c => wmo(c)[lang === 'en' ? 1 : 0];
const wIcon = (c, isDay) => 'fa-' + wmo(c)[isDay ? 2 : 3];

/* =====================================================================
   Themes (background gradients)
   ===================================================================== */
// key: [gradient, light theme?, theme-color, glow]
const THEMES = {
  'clear-day':   ['linear-gradient(165deg,#1a6fd0 0%,#3f9ee8 45%,#74b7e6 74%,#e3a957 100%)', false, '#1f7fe0', 'rgba(255,214,110,.45)'],
  'clear-night': ['linear-gradient(165deg,#070b22 0%,#1a1546 45%,#3a2470 80%,#5a3489 100%)', false, '#070b22', 'rgba(170,140,255,.22)'],
  'cloudy-day':  ['linear-gradient(165deg,#9fb2c6 0%,#c7d3de 50%,#eef2f5 100%)', true, '#9fb2c6', 'rgba(255,255,255,.55)'],
  'cloudy-night':['linear-gradient(165deg,#161b30 0%,#2c3352 55%,#4a4f70 100%)', false, '#161b30', 'rgba(160,170,220,.16)'],
  'rain-day':    ['linear-gradient(165deg,#2f3d50 0%,#4b5d74 50%,#7488a0 100%)', false, '#2f3d50', 'rgba(150,190,255,.18)'],
  'rain-night':  ['linear-gradient(165deg,#0b1220 0%,#1b2638 55%,#2c3b52 100%)', false, '#0b1220', 'rgba(120,160,230,.14)'],
  'storm':       ['linear-gradient(165deg,#14141f 0%,#2e2a44 50%,#55466a 100%)', false, '#14141f', 'rgba(190,150,255,.2)'],
  'snow-day':    ['linear-gradient(165deg,#b8c8db 0%,#dbe5f0 55%,#f4f7fb 100%)', true, '#b8c8db', 'rgba(255,255,255,.7)'],
  'snow-night':  ['linear-gradient(165deg,#18233b 0%,#34466a 55%,#64769a 100%)', false, '#18233b', 'rgba(200,220,255,.2)'],
  'fog-day':     ['linear-gradient(165deg,#a3adb6 0%,#c9d0d6 55%,#e5e8eb 100%)', true, '#a3adb6', 'rgba(255,255,255,.6)'],
  'fog-night':   ['linear-gradient(165deg,#1e232b 0%,#363d48 55%,#525a66 100%)', false, '#1e232b', 'rgba(200,200,220,.14)']
};
function themeKey(code, isDay){
  const g = wmo(code)[4];
  if(g === 'storm') return 'storm';
  return g + (isDay ? '-day' : '-night');
}
let activeBg = 'A', currentTheme = null;
function applyTheme(key){
  if(key === currentTheme) return;
  currentTheme = key;
  const th = THEMES[key] || THEMES['clear-day'];
  const next = activeBg === 'A' ? 'B' : 'A';
  const nextEl = $('#bg' + next), curEl = $('#bg' + activeBg);
  nextEl.style.background = th[0];
  requestAnimationFrame(() => { nextEl.classList.add('on'); curEl.classList.remove('on'); });
  activeBg = next;
  document.body.classList.toggle('light', th[1]);
  document.documentElement.style.setProperty('--glow', th[3]);
  document.querySelector('meta[name="theme-color"]').setAttribute('content', th[2]);
  if(radar.map) radarBase();
}

/* =====================================================================
   Indices
   ===================================================================== */
const UV_COLORS = ['#3ddc84','#ffd23f','#ff9233','#ff4d4d','#b46bff'];
function uvIdx(u){ return u < 3 ? 0 : u < 6 ? 1 : u < 8 ? 2 : u < 11 ? 3 : 4; }
const AQI_MAX = [20,40,60,80,100,Infinity];
const AQI_COLORS = ['#3ddc84','#a3e048','#ffd23f','#ff9233','#ff4d4d','#b46bff'];
const aqiIdx = v => AQI_MAX.findIndex(m => v <= m);
const POLLUTANTS = [
  ['pm2_5','PM2.5','fa-braille',[10,20,25,50,75]],
  ['pm10','PM10','fa-smog',[20,40,50,100,150]],
  ['nitrogen_dioxide','NO₂','fa-car',[40,90,120,230,340]],
  ['ozone','O₃','fa-sun-plant-wilt',[50,100,130,240,380]],
  ['sulphur_dioxide','SO₂','fa-industry',[100,200,350,500,750]],
  ['carbon_monoxide','CO','fa-fire',null]
];
const bandColor = (v, th) => {
  if(!th || !num(v)) return 'rgba(255,255,255,.5)';
  const i = th.findIndex(x => v <= x);
  return AQI_COLORS[i === -1 ? 5 : i];
};
const compass = d => t('compass')[Math.round((((d % 360) + 360) % 360) / 45) % 8];
function beaufort(kmh){
  const lim = [1,6,12,20,29,39,50,62,75,89,103,118];
  const i = lim.findIndex(x => kmh < x);
  return i === -1 ? 12 : i;
}
function seaStateIdx(h){ return h < 0.1 ? 0 : h < 0.5 ? 1 : h < 1.25 ? 2 : h < 2.5 ? 3 : 4; }
const SEA_COLORS = ['#3ddc84','#a3e048','#ffd23f','#ff9233','#ff4d4d'];

/* =====================================================================
   State & location
   ===================================================================== */
const DEFAULT_LOC = {lat:37.9838, lon:23.7275, def:true, cc:'GR'};
const state = {loc:null, wx:null, aq:null, sea:null, mode:'daily', chart:null, view:'now', reqId:0};
const gpsName = loc => loc.names && (loc.names[lang] || loc.names.el || loc.names.en);
function locName(loc){
  if(loc.def) return t('athens');
  if(loc.gps){ const n = gpsName(loc); return n ? n.name : t('myLocation'); }
  return loc.name || '—';
}
function locSubText(loc){
  if(loc.def) return t('attica');
  if(loc.gps){ const n = gpsName(loc); return (n && n.sub) || t('currentPos'); }
  return loc.sub || '';
}
const TIME_OPTS = {hour:'2-digit', minute:'2-digit', hourCycle:'h23'};

/* =====================================================================
   Data loading
   ===================================================================== */
async function loadWeather(loc){
  state.loc = loc;
  store.set('wx_loc', loc);
  renderHeader();
  loading(true);
  const myReq = ++state.reqId;
  const lat = loc.lat.toFixed(4), lon = loc.lon.toFixed(4);
  const base = 'latitude=' + lat + '&longitude=' + lon;
  const wxUrl = 'https://api.open-meteo.com/v1/forecast?' + base +
    '&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m,uv_index,pressure_msl,dew_point_2m' +
    '&minutely_15=precipitation&forecast_minutely_15=12' +
    '&hourly=temperature_2m,precipitation_probability,weather_code,is_day' +
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_probability_max' +
    '&timezone=auto&forecast_days=5&wind_speed_unit=kmh';
  const aqUrl = 'https://air-quality-api.open-meteo.com/v1/air-quality?' + base +
    '&current=european_aqi,pm10,pm2_5,nitrogen_dioxide,ozone,sulphur_dioxide,carbon_monoxide&timezone=auto';
  const seaUrl = 'https://marine-api.open-meteo.com/v1/marine?' + base +
    '&current=wave_height,wave_direction,wave_period,sea_surface_temperature&daily=wave_height_max&timezone=auto&forecast_days=1';
  try{
    const [wx, aq, sea] = await Promise.all([
      getJSON(wxUrl),
      getJSON(aqUrl).catch(() => null),
      getJSON(seaUrl).catch(() => null)
    ]);
    if(myReq !== state.reqId) return;          // a newer request superseded this one
    if(!wx || !wx.current || !wx.daily) throw new Error('bad payload');
    state.wx = wx; state.aq = aq; state.sea = sea;
    renderAll();
  }catch(e){
    if(myReq === state.reqId){ console.error(e); toast(t('fetchErr')); }
  }finally{
    if(myReq === state.reqId) loading(false);
  }
}

// Area name for GPS positions. BigDataCloud's client-side API may only be called with the device's
// live position, so both languages are fetched right away and kept with the location.
async function reverseOne(lat, lon, l){
  try{
    const d = await getJSON('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' + lat.toFixed(5) + '&longitude=' + lon.toFixed(5) + '&localityLanguage=' + l, 10000);
    const name = String(d.locality || d.city || '').trim();
    if(!name) return null;
    const sub = (d.city && d.city !== name) ? d.city : (d.principalSubdivision || d.countryName || '');
    return {name, sub, cc:d.countryCode || null};
  }catch(e){ return null; }
}
async function reverseNames(lat, lon){
  const [el, en] = await Promise.all([reverseOne(lat, lon, 'el'), reverseOne(lat, lon, 'en')]);
  if(!el && !en) return null;
  const names = {};
  if(el) names.el = {name:el.name, sub:el.sub};
  if(en) names.en = {name:en.name, sub:en.sub};
  return {names, cc:(el || en).cc};
}

function locate(){
  if(!('geolocation' in navigator)){ toast(t('geoUnsupported')); return; }
  $('#btnLocate').classList.add('spin');
  navigator.geolocation.getCurrentPosition(pos => {
    $('#btnLocate').classList.remove('spin');
    useGPS(pos.coords.latitude, pos.coords.longitude, state.loc);
    switchView('now');
  }, err => {
    $('#btnLocate').classList.remove('spin');
    toast(err && err.code === 1 ? t('geoDenied') : t('geoFailed'));
  }, {enableHighAccuracy:true, timeout:12000, maximumAge:300000});
}
function useGPS(lat, lon, prev){
  const loc = {lat, lon, gps:true, cc:null};
  // keep the previous name while the new one loads if we have barely moved
  if(prev && prev.names && haversineKm(lat, lon, prev.lat, prev.lon) < 1) loc.names = prev.names;
  loadWeather(loc);
  reverseNames(lat, lon).then(r => {
    if(!r || state.loc !== loc) return;      // user moved on to another place
    Object.assign(loc, r);
    store.set('wx_loc', loc);
    renderHeader();
  });
}

/* =====================================================================
   Rendering
   ===================================================================== */
function renderHeader(){
  const loc = state.loc; if(!loc) return;
  $('#locName').textContent = locName(loc);
  $('#locIcon').className = 'fa-solid ' + (loc.gps ? 'fa-location-arrow' : 'fa-location-dot');
  let sub = locSubText(loc);
  if(state.wx && state.wx.timezone){
    try{
      const lt = new Date().toLocaleString(t('locale'), Object.assign({timeZone:state.wx.timezone, weekday:'long', day:'numeric', month:'long'}, TIME_OPTS));
      sub = (sub ? sub + ' · ' : '') + lt;
    }catch(e){}
  }
  $('#locSub').textContent = sub || ' ';
}

function renderAll(){
  const wx = state.wx, c = wx.current, d = wx.daily;
  const isDay = c.is_day === 1;
  applyTheme(themeKey(c.weather_code, isDay));
  fxSet(c.weather_code, isDay);
  renderHeader();

  // Hero
  $('#heroIcon').className = 'fa-solid ' + wIcon(c.weather_code, isDay) + ' big-icon';
  $('#temp').textContent = r0(c.temperature_2m);
  $('#desc').textContent = wDesc(c.weather_code);
  $('#feels').textContent = r0(c.apparent_temperature) + '°';
  $('#tmax').textContent = r0(d.temperature_2m_max[0]) + '°';
  $('#tmin').textContent = r0(d.temperature_2m_min[0]) + '°';

  renderStrip();
  renderRain();

  // Humidity
  $('#hum').innerHTML = r0(c.relative_humidity_2m) + '<small>%</small>';
  $('#humBar').style.width = Math.max(0, Math.min(100, c.relative_humidity_2m || 0)) + '%';
  $('#humSub').textContent = t('dewPoint', {v:r0(c.dew_point_2m)});

  // Wind: direction is where it comes FROM; the arrow shows where it blows TO.
  // fa-location-arrow points north-east (45°) by default.
  $('#wind').innerHTML = r0(c.wind_speed_10m) + '<small>km/h</small>';
  $('#windArrow').style.transform = 'rotate(' + ((num(c.wind_direction_10m) ? c.wind_direction_10m : 0) + 135) + 'deg)';
  $('#windSub').textContent = compass(c.wind_direction_10m || 0) + ' · ' + beaufort(c.wind_speed_10m || 0) + ' Bf · ' + t('gusts') + ' ' + r0(c.wind_gusts_10m);

  // UV
  const uvNow = num(c.uv_index) ? c.uv_index : 0;
  const ui = uvIdx(uvNow);
  $('#uv').innerHTML = fmt1(Math.round(uvNow * 10) / 10) + '<small>/ ' + t('uvMax') + ' ' + r0(d.uv_index_max[0]) + '</small>';
  $('#uvDot').style.left = Math.min(100, uvNow / 11 * 100) + '%';
  const ub = $('#uvBadge'); ub.textContent = t('uvL')[ui]; ub.style.background = UV_COLORS[ui];

  // Elevation & pressure
  $('#elev').innerHTML = r0(wx.elevation) + '<small>' + t('meters') + '</small>';
  const ns = lang === 'en' ? ['N','S','E','W'] : ['Β','Ν','Α','Δ'];
  $('#coords').textContent = Math.abs(wx.latitude).toFixed(2) + '°' + (wx.latitude >= 0 ? ns[0] : ns[1]) + ', ' + Math.abs(wx.longitude).toFixed(2) + '°' + (wx.longitude >= 0 ? ns[2] : ns[3]);
  $('#press').innerHTML = r0(c.pressure_msl) + '<small>hPa</small>';
  $('#pressSub').textContent = c.pressure_msl < 1009 ? t('pressLow') : c.pressure_msl > 1022 ? t('pressHigh') : t('pressNormal');

  renderSea();
  renderSun();
  $('#updated').innerHTML = esc(t('updated', {t:hhmm(c.time)})) + ' <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a>';

  renderAir();
  renderDays();
  if(state.view === 'forecast') renderChart();
  if(radar.map) radarCenter();
}

function renderStrip(){
  const wx = state.wx, h = wx.hourly;
  if(!h || !h.time){ $('#strip').innerHTML = ''; return; }
  const curHour = wx.current.time.slice(0, 13);
  let s = h.time.findIndex(x => x.slice(0, 13) === curHour);
  if(s < 0) s = 0;
  const out = [];
  for(let i = s; i < Math.min(s + 24, h.time.length); i++){
    const isNow = i === s;
    const hr = h.time[i].slice(11, 13);
    const label = isNow ? t('nowLabel') : (hr === '00' ? dayShort(h.time[i]) : hr);
    const pp = h.precipitation_probability ? h.precipitation_probability[i] : null;
    const temp = isNow ? wx.current.temperature_2m : h.temperature_2m[i];
    const code = isNow ? wx.current.weather_code : h.weather_code[i];
    const day = isNow ? wx.current.is_day === 1 : (h.is_day ? h.is_day[i] === 1 : true);
    out.push('<div class="h' + (isNow ? ' now' : '') + '"><div class="ht">' + esc(label) + '</div>' +
      '<i class="fa-solid ' + wIcon(code, day) + '"></i>' +
      '<div class="hv">' + r0(temp) + '°</div>' +
      '<div class="hp">' + (num(pp) && pp >= 10 ? pp + '%' : '') + '</div></div>');
  }
  $('#strip').innerHTML = out.join('');
  $('#strip').scrollLeft = 0;
}

function rainInfo(){
  const wx = state.wx, m = wx.minutely_15;
  if(!m || !Array.isArray(m.time) || !Array.isArray(m.precipitation)) return null;
  const cur = wx.current.time;
  // slot that contains "now": the last slot that starts at or before the current time
  let s = -1;
  for(let i = 0; i < m.time.length; i++){ if(m.time[i] <= cur) s = i; else break; }
  if(s < 0) s = 0;
  const vals = m.precipitation.slice(s, s + 8).map(v => num(v) ? v : 0);
  if(vals.length < 4) return null;
  const WET = 0.1;
  const wet = vals.map(v => v >= WET);
  // precipitation includes snow: word it as snow when it is snowing or the next hours bring snow
  const h = wx.hourly, i0 = h && h.time ? Math.max(0, h.time.findIndex(x => x.slice(0, 13) === cur.slice(0, 13))) : -1;
  const snowy = wmo(wx.current.weather_code)[4] === 'snow' ||
    (i0 >= 0 && h.weather_code && [h.weather_code[i0 + 1], h.weather_code[i0 + 2]].some(c => wmo(c)[4] === 'snow'));
  const P = snowy ? 'snow' : 'rain';
  let msg, icon = snowy ? 'fa-snowflake' : 'fa-cloud-rain';
  if(wet[0]){
    const stop = wet.indexOf(false);
    msg = stop === -1 ? t(P + 'NowCont') : t(P + 'NowStops', {m:stop * 15});
  }else{
    const start = wet.indexOf(true);
    if(start === -1){ msg = t(P + 'None'); icon = 'fa-umbrella-beach'; }
    else msg = t(P + 'Starts', {m:start * 15});
  }
  return {vals, wet, msg, icon, title:t(P + 'Title')};
}
function renderRain(){
  const r = rainInfo(), card = $('#rainCard');
  if(!r){ card.classList.add('hidden'); return; }
  card.classList.remove('hidden');
  $('#rainTitle').textContent = r.title;
  $('#rainMsg').innerHTML = '<i class="fa-solid ' + r.icon + '"></i><span>' + esc(r.msg) + '</span>';
  // 1 mm in 15 minutes is heavy rain -> full bar
  $('#rainBars').innerHTML = r.vals.map((v, i) =>
    '<div class="' + (r.wet[i] ? '' : 'dry') + '" style="height:' + (r.wet[i] ? Math.max(12, Math.min(100, v * 100)) : 6) + '%" title="' + fmt1(v) + ' mm"></div>'
  ).join('');
}

function renderSea(){
  const m = state.sea, card = $('#seaCard');
  const c = m && m.current;
  const valid = c && (num(c.wave_height) || num(c.sea_surface_temperature));
  // Marine API snaps to the nearest sea cell; ignore it when that cell is far away (inland locations)
  const near = valid && num(m.latitude) && num(m.longitude) && haversineKm(state.loc.lat, state.loc.lon, m.latitude, m.longitude) <= 40;
  if(!valid || !near){ card.classList.add('hidden'); return; }
  card.classList.remove('hidden');
  $('#seaT').innerHTML = num(c.sea_surface_temperature) ? fmt1(Math.round(c.sea_surface_temperature * 10) / 10) + '<small>°C</small>' : '--';
  $('#seaW').innerHTML = num(c.wave_height) ? fmt1(c.wave_height) + '<small>m</small>' +
    (num(c.wave_direction) ? '<i class="fa-solid fa-arrow-up wd" style="transform:rotate(' + (c.wave_direction + 180) + 'deg)"></i>' : '') : '--';
  $('#seaP').innerHTML = num(c.wave_period) ? fmt1(c.wave_period) + '<small>s</small>' : '--';
  const b = $('#seaBadge');
  if(num(c.wave_height)){
    const i = seaStateIdx(c.wave_height);
    b.textContent = t('seaStates')[i]; b.style.background = SEA_COLORS[i]; b.classList.remove('hidden');
  }else b.classList.add('hidden');
  const mx = m.daily && m.daily.wave_height_max ? m.daily.wave_height_max[0] : null;
  $('#seaMax').textContent = num(mx) ? t('waveMax', {v:fmt1(mx)}) : '';
}

function renderSun(){
  const wx = state.wx, c = wx.current, d = wx.daily, isDay = c.is_day === 1;
  const sr = d.sunrise[0], ss = d.sunset[0];
  $('#sunrise').textContent = hhmm(sr);
  $('#sunset').textContent = hhmm(ss);
  // All three strings are local wall-clock times of the same zone, so parsing them alike keeps differences correct
  const srT = new Date(sr).getTime(), ssT = new Date(ss).getTime(), nowT = new Date(c.time).getTime();
  if(!num(srT) || !num(ssT) || ssT <= srT){ $('#dayLen').textContent = '—'; return; }
  const lenMin = Math.round((ssT - srT) / 60000);
  const f = Math.max(0, Math.min(1, (nowT - srT) / (ssT - srT)));
  const th = Math.PI * (1 - f);
  const x = 150 + 130 * Math.cos(th), y = 92 - 80 * Math.sin(th);
  ['#sunDot', '#sunDotGlow'].forEach(s => { $(s).setAttribute('cx', x.toFixed(1)); $(s).setAttribute('cy', y.toFixed(1)); });
  $('#sunDot').setAttribute('fill', isDay ? '#ffc94a' : '#9aa3c7');
  let meta = t('dayLen', {h:Math.floor(lenMin / 60), m:lenMin % 60});
  if(isDay && nowT < ssT && nowT >= srT){
    const left = Math.round((ssT - nowT) / 60000);
    meta += t('dayLeft', {h:Math.floor(left / 60), m:left % 60});
  }
  $('#dayLen').textContent = meta;
}

function renderAir(){
  const aq = state.aq && state.aq.current;
  if(!aq || !num(aq.european_aqi)){
    $('#aqiMini').textContent = '--';
    const mb = $('#aqiMiniBadge'); mb.textContent = t('na'); mb.style.background = '#ccc';
    $('#aqiVal').textContent = '--'; $('#aqiLabel').textContent = t('aqiNoTitle'); $('#aqiLabel').style.color = '';
    $('#aqiAdvice').textContent = t('aqiNoData');
    $('#aqiRing').style.strokeDashoffset = 339.3;
    $('#pollGrid').innerHTML = '';
    return;
  }
  const v = Math.round(aq.european_aqi), i = aqiIdx(v);
  $('#aqiMini').innerHTML = v + '<small>EAQI</small>';
  const mb = $('#aqiMiniBadge'); mb.textContent = t('aqiL')[i]; mb.style.background = AQI_COLORS[i];
  $('#aqiVal').textContent = v;
  $('#aqiLabel').textContent = t('aqiL')[i];
  $('#aqiLabel').style.color = AQI_COLORS[i];
  $('#aqiAdvice').textContent = t('aqiA')[i];
  const ring = $('#aqiRing'), C = 339.3;
  ring.setAttribute('stroke', AQI_COLORS[i]);
  ring.style.strokeDashoffset = C - C * Math.min(1, v / 100);
  $('#pollGrid').innerHTML = POLLUTANTS.map(p => {
    const val = aq[p[0]];
    const shown = !num(val) ? '--' : (p[0] === 'carbon_monoxide' ? Math.round(val) : fmt1(Math.round(val * 10) / 10));
    return '<div class="tile glass"><div class="t-head"><i class="fa-solid ' + p[2] + '"></i>' + p[1] +
      '<span class="dot" style="background:' + bandColor(val, p[3]) + '"></span></div>' +
      '<div class="t-val">' + shown + '<small>µg/m³</small></div></div>';
  }).join('');
}

const dayShort = iso => new Date(iso.slice(0, 10) + 'T12:00:00').toLocaleDateString(t('locale'), {weekday:'short'}).replace('.', '');
const dayDate = iso => new Date(iso.slice(0, 10) + 'T12:00:00').toLocaleDateString(t('locale'), {day:'numeric', month:'short'});

function renderDays(){
  const d = state.wx.daily;
  const mins = d.temperature_2m_min.filter(num), maxs = d.temperature_2m_max.filter(num);
  if(!mins.length || !maxs.length){ $('#dayList').innerHTML = ''; return; }
  const gMin = Math.min(...mins), gMax = Math.max(...maxs), span = Math.max(1, gMax - gMin);
  $('#dayList').innerHTML = d.time.map((day, i) => {
    const lo = d.temperature_2m_min[i], hi = d.temperature_2m_max[i];
    const left = (lo - gMin) / span * 100, width = (hi - lo) / span * 100;
    const pp = d.precipitation_probability_max ? d.precipitation_probability_max[i] : null;
    return '<div class="day">' +
      '<div class="dn">' + (i === 0 ? esc(t('today')) : esc(dayShort(day))) + '<small>' + esc(dayDate(day)) + '</small></div>' +

      '</div>';
  }).join('');
}

/* =====================================================================
   Rain radar (RainViewer free API: past 2 h, 10-min frames, max zoom 7,
   colour scheme 2 = Universal Blue, 100 requests / min / IP)
   ===================================================================== */
const radar = {map:null, base:null, baseKey:null, marker:null, frames:[], host:'', layers:{}, idx:0, timer:null, loadedAt:0, loading:false};
const LEAFLET_CSS = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';
const LEAFLET_JS = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
let leafletReady = null;
function ensureLeaflet(){
  if(window.L && window.L.map) return Promise.resolve();
  if(!leafletReady) leafletReady = Promise.all([loadCSS(LEAFLET_CSS).catch(() => {}), loadJS(LEAFLET_JS)]);
  return leafletReady;
}
async function radarOpen(){
  try{ await ensureLeaflet(); }
  catch(e){ leafletReady = null; radarMsg(t('radarErr')); return; }
  if(state.view !== 'radar') return;
  const loc = state.loc || DEFAULT_LOC;
  if(!radar.map){
    radar.map = L.map('radarMap', {zoomControl:false, minZoom:3, maxZoom:10, worldCopyJump:true, attributionControl:true})
      .setView([loc.lat, loc.lon], 7);
    L.control.zoom({position:'topright'}).addTo(radar.map);
    radar.map.attributionControl.setPrefix(false);
  }
  radarBase();
  radarCenter();
  setTimeout(() => radar.map && radar.map.invalidateSize(), 80);
  if(Date.now() - radar.loadedAt > 5 * 60 * 1000) await radarLoadFrames();
  else radarShow(radar.idx);
}
function radarBase(){
  if(!radar.map) return;
  const key = document.body.classList.contains('light') ? 'light_all' : 'dark_all';
  if(key === radar.baseKey) return;
  if(radar.base) radar.map.removeLayer(radar.base);
  radar.base = L.tileLayer('https://{s}.basemaps.cartocdn.com/' + key + '/{z}/{x}/{y}{r}.png', {
    subdomains:'abcd', maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a>'
  }).addTo(radar.map);
  radar.base.bringToBack();
  radar.baseKey = key;
}
function radarCenter(){
  if(!radar.map || !state.loc) return;
  const ll = [state.loc.lat, state.loc.lon];
  if(!radar.marker){
    radar.marker = L.marker(ll, {icon:L.divIcon({className:'', html:'<div class="me-dot"></div>', iconSize:[16,16], iconAnchor:[8,8]}), interactive:false, keyboard:false}).addTo(radar.map);
  }else radar.marker.setLatLng(ll);
  radar.map.setView(ll, radar.map.getZoom() || 7, {animate:false});
}
async function radarLoadFrames(){
  if(radar.loading) return;
  radar.loading = true;
  try{
    const d = await getJSON('https://api.rainviewer.com/public/weather-maps.json', 12000);
    const frames = (d && d.radar && Array.isArray(d.radar.past)) ? d.radar.past.filter(f => f && f.path && num(f.time)) : [];
    if(!d.host || !frames.length) throw new Error('no frames');
    Object.values(radar.layers).forEach(l => { if(radar.map.hasLayer(l)) radar.map.removeLayer(l); });
    radar.layers = {};
    radar.host = d.host; radar.frames = frames; radar.loadedAt = Date.now();
    const sl = $('#radarSlider'); sl.max = frames.length - 1;
    radarShow(frames.length - 1);
    radarMsg(t('radarHint'));
  }catch(e){
    radarMsg(t('radarErr'));
  }finally{ radar.loading = false; }
}
function frameLayer(i){
  const f = radar.frames[i];
  if(!radar.layers[f.path]){
    // 512 px tiles at zoom-1 => 4x fewer requests; native zoom capped at 7 by the API
    radar.layers[f.path] = L.tileLayer(radar.host + f.path + '/512/{z}/{x}/{y}/2/1_1.png', {
      tileSize:512, zoomOffset:-1, maxNativeZoom:8, maxZoom:10, opacity:0, zIndex:10,
      attribution:'<a href="https://www.rainviewer.com" target="_blank" rel="noopener">RainViewer</a>'
    });
  }
  return radar.layers[f.path];
}
function radarShow(i){
  const n = radar.frames.length;
  if(!n || !radar.map) return;
  i = ((i % n) + n) % n;
  const cur = frameLayer(i), nxt = frameLayer((i + 1) % n);
  // Only the visible frame and the next one stay on the map: limits requests to the API's rate limit
  Object.values(radar.layers).forEach(l => { if(l !== cur && l !== nxt && radar.map.hasLayer(l)) radar.map.removeLayer(l); });
  [cur, nxt].forEach(l => { if(!radar.map.hasLayer(l)) l.addTo(radar.map); });
  if(nxt !== cur) nxt.setOpacity(0);
  cur.setOpacity(0.8);
  radar.idx = i;
  $('#radarSlider').value = i;
  const f = radar.frames[i];
  const tz = state.wx && state.wx.timezone;
  let hm;
  try{ hm = new Date(f.time * 1000).toLocaleTimeString(t('locale'), Object.assign({timeZone:tz || undefined}, TIME_OPTS)); }
  catch(e){ hm = new Date(f.time * 1000).toLocaleTimeString(t('locale'), TIME_OPTS); }
  const ago = Math.max(0, Math.round((radar.frames[n - 1].time - f.time) / 60));
  $('#radarTime').innerHTML = esc(hm) + '<small>' + esc(i === n - 1 ? t('radarLatest') : t('radarAgo', {m:ago})) + '</small>';
}
function radarPlay(on){
  clearInterval(radar.timer); radar.timer = null;
  $('#radarPlay').innerHTML = '<i class="fa-solid fa-' + (on ? 'pause' : 'play') + '"></i>';
  if(!on || radar.frames.length < 2) return;
  let hold = 0;
  radar.timer = setInterval(() => {
    if(radar.idx === radar.frames.length - 1 && hold < 2){ hold++; return; }   // pause briefly on the latest frame
    hold = 0;
    radarShow(radar.idx + 1);
  }, 650);
}
function radarMsg(m){ $('#radarMsg').textContent = m; }

/* =====================================================================
   Live effects (canvas)
   ===================================================================== */
const fx = {
  enabled: store.get('wx_fx', true),
  reduce: window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches,
  canvas:null, ctx:null, w:0, h:0, dpr:1, parts:[], kind:null, intensity:0, raf:0, last:0,
  lightning:false, nextBolt:0, cloudSprite:null, light:false
};
function fxResize(){
  const c = fx.canvas; if(!c) return;
  fx.dpr = Math.min(window.devicePixelRatio || 1, 2);
  fx.w = window.innerWidth; fx.h = window.innerHeight;
  c.width = Math.round(fx.w * fx.dpr); c.height = Math.round(fx.h * fx.dpr);
  fx.ctx.setTransform(fx.dpr, 0, 0, fx.dpr, 0, 0);
  fxSeed();
}
function cloudSprite(){
  if(fx.cloudSprite) return fx.cloudSprite;
  const s = document.createElement('canvas'); s.width = 360; s.height = 180;
  const x = s.getContext('2d');
  [[90,110,70],[170,85,85],[255,110,70],[175,120,75]].forEach(([cx, cy, r]) => {
    const g = x.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g; x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fill();
  });
  return (fx.cloudSprite = s);
}
// kind: rain | snow | stars | clouds | fog | motes | null ; intensity 0..1
function fxSet(code, isDay){
  const g = wmo(code)[4];
  let kind = null, intensity = 0.5, lightning = false;
  if(g === 'rain' || g === 'storm'){
    kind = 'rain';
    intensity = [51,56].includes(code) ? 0.25 : [53,57,61,80].includes(code) ? 0.45 : [63,66,81].includes(code) ? 0.7 : 1;
    lightning = [95,96,99].includes(code);
  }else if(g === 'snow'){
    kind = 'snow'; intensity = [71,77,85].includes(code) ? 0.4 : code === 73 ? 0.7 : 1;
  }else if(g === 'fog'){ kind = 'fog'; intensity = 0.7; }
  else if(g === 'cloudy'){ kind = isDay ? 'clouds' : 'starsClouds'; intensity = code === 3 ? 1 : 0.55; }
  else if(g === 'clear'){ kind = isDay ? 'motes' : 'stars'; intensity = code === 0 ? 1 : 0.7; }
  fx.light = document.body.classList.contains('light');
  const changed = kind !== fx.kind || intensity !== fx.intensity;
  fx.kind = kind; fx.intensity = intensity; fx.lightning = lightning;
  if(changed) fxSeed();
  fxStart();
}
function rnd(a, b){ return a + Math.random() * (b - a); }
function fxSeed(){
  const W = fx.w, H = fx.h, k = fx.kind, I = fx.intensity;
  const area = (W * H) / (390 * 844);    // scale counts to the screen size
  const P = [];
  if(k === 'rain'){
    const n = Math.round((60 + 220 * I) * area);
    for(let i = 0; i < n; i++) P.push({x:rnd(0, W), y:rnd(-H, H), l:rnd(10, 22), v:rnd(650, 1000), a:rnd(.25, .6)});
  }else if(k === 'snow'){
    const n = Math.round((40 + 130 * I) * area);
    for(let i = 0; i < n; i++) P.push({x:rnd(0, W), y:rnd(-H, H), r:rnd(1.2, 3.6), v:rnd(30, 80), ph:rnd(0, 6.28), sw:rnd(15, 40), a:rnd(.55, .95)});
  }else if(k === 'stars' || k === 'starsClouds'){
    const n = Math.round((k === 'stars' ? 110 : 45) * area * (0.6 + 0.4 * I));
    for(let i = 0; i < n; i++) P.push({x:rnd(0, W), y:rnd(0, H * 0.75), r:rnd(.4, 1.6), ph:rnd(0, 6.28), sp:rnd(.6, 2.2), a:rnd(.35, .95)});
    if(k === 'starsClouds') for(let i = 0; i < 4; i++) P.push({cloud:true, x:rnd(-200, W), y:rnd(0, H * 0.55), s:rnd(.7, 1.5), v:rnd(4, 10), a:rnd(.10, .2)});
  }else if(k === 'clouds'){
    const n = Math.round(4 + 4 * I);
    for(let i = 0; i < n; i++) P.push({cloud:true, x:rnd(-300, W), y:rnd(-20, H * 0.6), s:rnd(.8, 1.8), v:rnd(5, 14), a:rnd(.18, .4)});
  }else if(k === 'fog'){
    for(let i = 0; i < 6; i++) P.push({y:rnd(H * 0.15, H), x:rnd(-W, 0), w:rnd(W * 1.2, W * 2), h:rnd(70, 160), v:rnd(6, 16), a:rnd(.12, .25)});
  }else if(k === 'motes'){
    const n = Math.round(26 * area);
    for(let i = 0; i < n; i++) P.push({x:rnd(0, W), y:rnd(0, H), r:rnd(1, 2.6), vx:rnd(-6, 6), vy:rnd(-10, -3), ph:rnd(0, 6.28), a:rnd(.2, .5)});
  }
  fx.parts = P;
  fx.nextBolt = performance.now() + rnd(2500, 6000);
}
function fxStart(){
  const active = fx.enabled && !fx.reduce && fx.kind && !document.hidden;
  if(!active){ fxStop(true); return; }
  if(!fx.raf){ fx.last = performance.now(); fx.raf = requestAnimationFrame(fxFrame); }
}
function fxStop(clear){
  if(fx.raf){ cancelAnimationFrame(fx.raf); fx.raf = 0; }
  if(clear && fx.ctx) fx.ctx.clearRect(0, 0, fx.w, fx.h);
}
function fxFrame(now){
  fx.raf = requestAnimationFrame(fxFrame);
  const dt = Math.min(0.05, (now - fx.last) / 1000); fx.last = now;
  const c = fx.ctx, W = fx.w, H = fx.h, k = fx.kind;
  c.clearRect(0, 0, W, H);
  if(k === 'rain'){
    c.lineCap = 'round'; c.lineWidth = 1.2;
    const col = fx.light ? '60,90,130' : '200,220,255', slant = 0.18;
    for(const p of fx.parts){
      p.y += p.v * dt; p.x += p.v * slant * dt;
      if(p.y > H){ p.y = rnd(-40, -10); p.x = rnd(-60, W); }
      c.strokeStyle = 'rgba(' + col + ',' + p.a + ')';
      c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x - p.l * slant, p.y - p.l); c.stroke();
    }
    if(fx.lightning && now > fx.nextBolt){
      fx.nextBolt = now + rnd(3500, 9000);
      const fl = $('#flash');
      fl.animate([{opacity:0},{opacity:.85},{opacity:.1},{opacity:.6},{opacity:0}], {duration:700, easing:'ease-out'});
    }
  }else if(k === 'snow'){
    for(const p of fx.parts){
      p.y += p.v * dt; p.ph += dt;
      const x = p.x + Math.sin(p.ph) * p.sw * 0.4;
      if(p.y > H + 5){ p.y = -5; p.x = rnd(0, W); }
      c.fillStyle = 'rgba(255,255,255,' + p.a + ')';
      if(fx.light){ c.strokeStyle = 'rgba(90,110,140,.35)'; c.lineWidth = .8; }
      c.beginPath(); c.arc(x, p.y, p.r, 0, Math.PI * 2); c.fill();
      if(fx.light) c.stroke();
    }
  }else if(k === 'stars' || k === 'starsClouds'){
    const sprite = cloudSprite();
    for(const p of fx.parts){
      if(p.cloud){
        p.x += p.v * dt; if(p.x > W + 50) p.x = -360 * p.s;
        c.globalAlpha = p.a; c.drawImage(sprite, p.x, p.y, 360 * p.s, 180 * p.s); c.globalAlpha = 1;
        continue;
      }
      p.ph += p.sp * dt;
      c.fillStyle = 'rgba(255,255,255,' + (p.a * (0.55 + 0.45 * Math.sin(p.ph))).toFixed(3) + ')';
      c.beginPath(); c.arc(p.x, p.y, p.r, 0, Math.PI * 2); c.fill();
    }
  }else if(k === 'clouds'){
    const sprite = cloudSprite();
    for(const p of fx.parts){
      p.x += p.v * dt; if(p.x > W + 50) p.x = -360 * p.s;
      c.globalAlpha = p.a; c.drawImage(sprite, p.x, p.y, 360 * p.s, 180 * p.s);
    }
    c.globalAlpha = 1;
  }else if(k === 'fog'){
    for(const p of fx.parts){
      p.x += p.v * dt; if(p.x > W) p.x = -p.w;
      const g = c.createLinearGradient(0, p.y - p.h / 2, 0, p.y + p.h / 2);
      g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, 'rgba(255,255,255,' + p.a + ')'); g.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = g; c.fillRect(p.x, p.y - p.h / 2, p.w, p.h);
    }
  }else if(k === 'motes'){
    for(const p of fx.parts){
      p.x += p.vx * dt; p.y += p.vy * dt; p.ph += dt;
      if(p.y < -5){ p.y = H + 5; p.x = rnd(0, W); }
      if(p.x < -5) p.x = W + 5; else if(p.x > W + 5) p.x = -5;
      c.fillStyle = 'rgba(255,240,200,' + (p.a * (0.6 + 0.4 * Math.sin(p.ph * 1.5))).toFixed(3) + ')';
      c.beginPath(); c.arc(p.x, p.y, p.r, 0, Math.PI * 2); c.fill();
    }
  }
}
function setFx(on){
  fx.enabled = on; store.set('wx_fx', on);
  $$('#fxSeg button').forEach(b => b.classList.toggle('on', (b.dataset.fx === '1') === on));
  fxStart();
}

/* =====================================================================
   Search (Open-Meteo Geocoding)
   ===================================================================== */
let qTimer, qSeq = 0, lastResults = [];
function renderRecent(){
  const rec = store.get('wx_recent', []);
  $('#resLabel').textContent = t('recent');
  if(!rec.length){
    $('#results').innerHTML = '<div class="empty"><i class="fa-solid fa-earth-europe"></i>' + esc(t('searchEmpty')) + '</div>';
    return;
  }
  $('#results').innerHTML = rec.map((r, i) => resRow(r, 'rec', i)).join('');
}
function resRow(r, kind, i){
  return '<div class="res" data-kind="' + kind + '" data-i="' + i + '">' +
    '<div class="flag">' + flag(r.cc) + '</div>' +
    '<div><div class="rn">' + esc(r.name) + '</div><div class="rs">' + esc(r.sub || '') + '</div></div>' +
    '<i class="fa-solid fa-chevron-right chev"></i></div>';
}
async function doSearch(q){
  const seq = ++qSeq;
  if(q.length < 2){ renderRecent(); return; }
  $('#resLabel').textContent = t('results');
  $('#results').innerHTML = '<div class="empty"><i class="fa-solid fa-circle-notch fa-spin"></i>' + esc(t('searching')) + '</div>';
  try{
    const url = 'https://geocoding-api.open-meteo.com/v1/search?name=' + encodeURIComponent(q) + '&count=10&language=' + lang + '&format=json';
    const data = await getJSON(url);
    if(seq !== qSeq) return;
    lastResults = (data.results || []).filter(r => num(r.latitude) && num(r.longitude)).map(r => ({
      lat:r.latitude, lon:r.longitude, name:r.name, cc:r.country_code,
      sub:[r.admin1, r.country].filter(Boolean).join(', ') + (num(r.elevation) ? ' · ' + Math.round(r.elevation) + ' ' + t('meters') : '')
    }));
    $('#results').innerHTML = lastResults.length
      ? lastResults.map((r, i) => resRow(r, 'res', i)).join('')
      : '<div class="empty"><i class="fa-regular fa-face-frown"></i>' + esc(t('noResults', {q})) + '</div>';
  }catch(e){
    if(seq !== qSeq) return;
    $('#results').innerHTML = '<div class="empty"><i class="fa-solid fa-wifi"></i>' + esc(t('netErr')) + '</div>';
  }
}
function pickLocation(r){
  const rec = store.get('wx_recent', []).filter(x => !(Math.abs(x.lat - r.lat) < 1e-3 && Math.abs(x.lon - r.lon) < 1e-3));
  rec.unshift(r); store.set('wx_recent', rec.slice(0, 6));
  $('#q').value = ''; $('#qClear').style.display = 'none'; $('#q').blur();
  renderRecent();
  switchView('now');
  loadWeather(Object.assign({}, r));
}

/* =====================================================================
   Navigation, language, misc UI
   ===================================================================== */
function switchView(v){
  const prev = state.view;
  state.view = v;
  $$('.view').forEach(el => el.classList.toggle('active', el.id === 'view-' + v));
  $$('nav.bottom button').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  $('#main').scrollTop = 0;
  if(prev === 'radar' && v !== 'radar') radarPlay(false);
  if(v === 'forecast') setTimeout(renderChart, 30);
  if(v === 'radar') radarOpen();
}
function setLang(l){
  if(!I18N[l] || l === lang) return;
  lang = l; store.set('wx_lang', l);
  applyStatic();
  renderRecent();
  if($('#q').value.trim().length >= 2) doSearch($('#q').value.trim());
  if(state.wx) renderAll(); else renderHeader();
  if(state.view === 'forecast') renderChart();
  if(radar.frames.length) radarShow(radar.idx);
}
let toastTimer;
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 3200);
}
function loading(on){
  $('#loader').classList.toggle('on', on);
  $('#btnRefresh').classList.toggle('spin', on);
}

/* =====================================================================
   PWA: generated icons & manifest
   ===================================================================== */
function makeIcon(size){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, size, size);
  g.addColorStop(0, '#1f7fe0'); g.addColorStop(.6, '#4fb0f2'); g.addColorStop(1, '#f7c86a');
  x.fillStyle = g; x.fillRect(0, 0, size, size);
  const s = size / 100;
  x.fillStyle = '#ffd24a'; x.shadowColor = 'rgba(255,200,60,.8)'; x.shadowBlur = 12 * s;
  x.beginPath(); x.arc(40 * s, 40 * s, 18 * s, 0, Math.PI * 2); x.fill();
  x.shadowBlur = 0; x.fillStyle = 'rgba(255,255,255,.95)';
  x.beginPath();
  x.arc(48 * s, 64 * s, 14 * s, 0, Math.PI * 2);
  x.arc(64 * s, 56 * s, 18 * s, 0, Math.PI * 2);
  x.arc(78 * s, 66 * s, 12 * s, 0, Math.PI * 2);
  x.fill();
  x.fillRect(48 * s, 62 * s, 30 * s, 16 * s);
  return c.toDataURL('image/png');
}
function setupPWA(){
  try{
    const i180 = makeIcon(180), i192 = makeIcon(192), i512 = makeIcon(512);
    $('#touchIcon').href = i180;
    $('#favIcon').href = i192;
    const base = location.href.split('#')[0].split('?')[0];
    const manifest = {
      name:'Καιρός', short_name:'Καιρός', start_url:base, scope:base.substring(0, base.lastIndexOf('/') + 1),
      display:'standalone', orientation:'portrait', background_color:'#1f7fe0', theme_color:'#1f7fe0',
      icons:[{src:i192, sizes:'192x192', type:'image/png'}, {src:i512, sizes:'512x512', type:'image/png', purpose:'any maskable'}]
    };
    $('#manifestLink').href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'}));
  }catch(e){}
}

/* =====================================================================
   Events
   ===================================================================== */
$$('nav.bottom button').forEach(b => b.addEventListener('click', () => switchView(b.dataset.view)));
$('#btnLocate').addEventListener('click', locate);
$('#btnLocate2').addEventListener('click', locate);
$('#btnRefresh').addEventListener('click', () => {
  if(state.loc) loadWeather(state.loc);
  if(state.view === 'radar'){ radar.loadedAt = 0; radarOpen(); }
});
$('#aqiTile').addEventListener('click', () => switchView('air'));
$$('#modeSeg button').forEach(b => b.addEventListener('click', () => {
  $$('#modeSeg button').forEach(x => x.classList.toggle('on', x === b));
  state.mode = b.dataset.mode;
  $('#chartScroll').scrollLeft = 0;
  renderChart();
}));
$$('#langSeg button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
$$('#fxSeg button').forEach(b => b.addEventListener('click', () => setFx(b.dataset.fx === '1')));
$('#radarPlay').addEventListener('click', () => radarPlay(!radar.timer));
$('#radarSlider').addEventListener('input', e => { radarPlay(false); radarShow(+e.target.value); });
$('#q').addEventListener('input', e => {
  const v = e.target.value.trim();
  $('#qClear').style.display = v ? 'block' : 'none';
  clearTimeout(qTimer); qTimer = setTimeout(() => doSearch(v), 350);
});
$('#q').addEventListener('keydown', e => { if(e.key === 'Enter'){ clearTimeout(qTimer); doSearch(e.target.value.trim()); } });
$('#qClear').addEventListener('click', () => { $('#q').value = ''; $('#qClear').style.display = 'none'; renderRecent(); $('#q').focus(); });
$('#results').addEventListener('click', e => {
  const row = e.target.closest('.res'); if(!row) return;
  const list = row.dataset.kind === 'rec' ? store.get('wx_recent', []) : lastResults;
  const r = list[+row.dataset.i]; if(r) pickLocation(r);
});
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if(document.hidden){ hiddenAt = Date.now(); fxStop(false); radarPlay(false); return; }
  fxStart();
  if(state.loc && Date.now() - hiddenAt > 10 * 60 * 1000){
    loadWeather(state.loc);
    if(state.view === 'radar'){ radar.loadedAt = 0; radarOpen(); }
  }
});
let resizeT;
window.addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => {
    fxResize();
    if(state.wx && state.view === 'forecast') renderChart();
    if(radar.map) radar.map.invalidateSize();
  }, 200);
});

/* =====================================================================
   Init
   ===================================================================== */
fx.canvas = $('#fx'); fx.ctx = fx.canvas.getContext('2d');
fxResize();
setupPWA();
applyStatic();
applyTheme('clear-day');
renderRecent();
const saved = store.get('wx_loc', null);
if(saved && num(saved.lat) && num(saved.lon)){
  if(saved.gps){ delete saved.name; delete saved.sub; }   // names from v1 were fixed labels, not place names
  loadWeather(saved);
  // a GPS location is refreshed with the live position (also fetches the area name)
  if(saved.gps && 'geolocation' in navigator){
    navigator.geolocation.getCurrentPosition(pos => {
      if(state.loc && state.loc.gps) useGPS(pos.coords.latitude, pos.coords.longitude, state.loc);
    }, () => {}, {timeout:10000, maximumAge:600000});
  }
}else{
  loadWeather(Object.assign({}, DEFAULT_LOC));
  if('geolocation' in navigator){
    navigator.geolocation.getCurrentPosition(pos => useGPS(pos.coords.latitude, pos.coords.longitude), () => {}, {timeout:10000, maximumAge:600000});
  }
}
// Test hook (harmless in production)
window.__wx = {state, radar, fx, setLang, switchView, renderAll, t};
})();
</script>
</body>
</html>
